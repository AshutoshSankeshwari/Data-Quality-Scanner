<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 520" width="100%" height="100%" style="background:#ffffff; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;">
  <defs>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="115%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#0f172a" flood-opacity="0.08" />
    </filter>
    <linearGradient id="headerGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e3a8a" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <linearGradient id="coreGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284c7" />
      <stop offset="100%" stop-color="#0369a1" />
    </linearGradient>
    <linearGradient id="entryGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2563eb" />
      <stop offset="100%" stop-color="#1d4ed8" />
    </linearGradient>
    <linearGradient id="dataGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0d9488" />
      <stop offset="100%" stop-color="#0f766e" />
    </linearGradient>
  </defs>

  <!-- Host Machine Boundary -->
  <rect x="20" y="20" width="860" height="480" rx="14" fill="#f8fafc" stroke="#cbd5e1" stroke-width="2" />
  <rect x="20" y="20" width="860" height="42" rx="14" fill="url(#headerGrad)" />
  <text x="40" y="47" fill="#ffffff" font-size="15" font-weight="700" letter-spacing="0.5">TARGET MACHINE (Validated Environment: Windows 10/11 · Python 3.11+ 64-bit)</text>
  <rect x="740" y="29" width="120" height="24" rx="6" fill="#ffffff" fill-opacity="0.15" />
  <text x="752" y="45" fill="#ffffff" font-size="11" font-weight="600">Local Standalone</text>

  <!-- Virtual Environment Boundary -->
  <rect x="45" y="80" width="810" height="245" rx="10" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="6,4" />
  <text x="65" y="104" fill="#475569" font-size="12" font-weight="700" letter-spacing="0.5">ISOLATED RUNTIME ENVIRONMENT (.venv)</text>

  <!-- Entry Points Box 1: GUI -->
  <g filter="url(#shadow)">
    <rect x="75" y="125" width="340" height="75" rx="8" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5" />
    <rect x="75" y="125" width="8" height="75" rx="4" fill="#2563eb" />
    <text x="98" y="152" fill="#0f172a" font-size="14" font-weight="700">Desktop GUI Mode (main.py)</text>
    <text x="98" y="172" fill="#64748b" font-size="12">Interactive exploration, preview grid, and dialogs</text>
    <text x="98" y="188" fill="#0284c7" font-size="11" font-weight="600">Runtime: PySide6 / Qt 6 Framework</text>
  </g>

  <!-- Entry Points Box 2: CLI -->
  <g filter="url(#shadow)">
    <rect x="485" y="125" width="340" height="75" rx="8" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5" />
    <rect x="485" y="125" width="8" height="75" rx="4" fill="#059669" />
    <text x="508" y="152" fill="#0f172a" font-size="14" font-weight="700">Headless Batch / CLI (batch_runner.py)</text>
    <text x="508" y="172" fill="#64748b" font-size="12">Automated CI/CD, scheduled tasks, scripts</text>
    <text x="508" y="188" fill="#059669" font-size="11" font-weight="600">Runtime: Zero GUI dependencies (argparse)</text>
  </g>

  <!-- Arrows from Entry to Core -->
  <path d="M 245 200 L 245 225 L 430 225 L 430 240" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)" />
  <path d="M 655 200 L 655 225 L 470 225 L 470 240" fill="none" stroke="#64748b" stroke-width="2" />
  <polygon points="450,240 445,230 455,230" fill="#64748b" />

  <!-- Shared Core Engine -->
  <g filter="url(#shadow)">
    <rect x="180" y="240" width="540" height="70" rx="8" fill="url(#coreGrad)" />
    <text x="450" y="266" text-anchor="middle" fill="#ffffff" font-size="15" font-weight="700">Shared Analytical Engine (core/ &amp; rules/)</text>
    <text x="450" y="290" text-anchor="middle" fill="#e0f2fe" font-size="12">8 Quality Checks · Dynamic Readiness Scoring · Heuristic Inferrer · Validation</text>
  </g>

  <!-- Connectors to External Storage Layers -->
  <path d="M 230 310 L 230 345 L 140 345 L 140 360" fill="none" stroke="#94a3b8" stroke-width="2" />
  <path d="M 380 310 L 380 360" fill="none" stroke="#94a3b8" stroke-width="2" />
  <path d="M 520 310 L 520 360" fill="none" stroke="#94a3b8" stroke-width="2" />
  <path d="M 670 310 L 670 345 L 760 345 L 760 360" fill="none" stroke="#94a3b8" stroke-width="2" />

  <!-- Storage Node 1: Configuration -->
  <g filter="url(#shadow)">
    <rect x="45" y="360" width="190" height="115" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5" />
    <rect x="45" y="360" width="190" height="28" rx="8" fill="#f1f5f9" />
    <text x="55" y="379" fill="#1e293b" font-size="12" font-weight="700">Configuration</text>
    <text x="55" y="405" fill="#334155" font-size="11" font-weight="600">config/config.yaml</text>
    <text x="55" y="420" fill="#64748b" font-size="10">User business rules</text>
    <text x="55" y="442" fill="#334155" font-size="11" font-weight="600">config/admin_config.yaml</text>
    <text x="55" y="457" fill="#64748b" font-size="10">Admin parameters &amp; dates</text>
  </g>

  <!-- Storage Node 2: Branding Assets -->
  <g filter="url(#shadow)">
    <rect x="250" y="360" width="180" height="115" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5" />
    <rect x="250" y="360" width="180" height="28" rx="8" fill="#f1f5f9" />
    <text x="260" y="379" fill="#1e293b" font-size="12" font-weight="700">Static Branding</text>
    <text x="260" y="405" fill="#334155" font-size="11" font-weight="600">assets/branding/</text>
    <text x="260" y="422" fill="#64748b" font-size="10">Corporate logo artwork</text>
    <text x="260" y="442" fill="#0284c7" font-size="10" font-weight="600">Formats: PNG, JPG, SVG</text>
    <text x="260" y="457" fill="#64748b" font-size="10">Safe text fallback</text>
  </g>

  <!-- Storage Node 3: Local Persistence -->
  <g filter="url(#shadow)">
    <rect x="445" y="360" width="190" height="115" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5" />
    <rect x="445" y="360" width="190" height="28" rx="8" fill="#f1f5f9" />
    <text x="455" y="379" fill="#1e293b" font-size="12" font-weight="700">Local Persistence</text>
    <text x="455" y="405" fill="#0d9488" font-size="11" font-weight="600">data/scanner.db</text>
    <text x="455" y="422" fill="#64748b" font-size="10">Embedded SQLite (WAL)</text>
    <text x="455" y="442" fill="#0d9488" font-size="10" font-weight="600">Audit metadata &amp; scores</text>
    <text x="455" y="457" fill="#dc2626" font-size="10" font-weight="600">Zero raw data stored</text>
  </g>

  <!-- Storage Node 4: Generated Reports -->
  <g filter="url(#shadow)">
    <rect x="650" y="360" width="205" height="115" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5" />
    <rect x="650" y="360" width="205" height="28" rx="8" fill="#f1f5f9" />
    <text x="660" y="379" fill="#1e293b" font-size="12" font-weight="700">Export Deliverables</text>
    <text x="660" y="405" fill="#334155" font-size="11" font-weight="600">reports/ directory</text>
    <text x="660" y="422" fill="#64748b" font-size="10">Multi-sheet Excel (.xlsx)</text>
    <text x="660" y="438" fill="#64748b" font-size="10">Standalone HTML (.html)</text>
    <text x="660" y="454" fill="#64748b" font-size="10">Structured JSON (.json)</text>
  </g>
</svg>
